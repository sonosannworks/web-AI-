<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>要介護認定1次判定アプリへ移動します｜sonosann Web&AIサポート</title>

<!--
  ============================================================
  要介護認定1次判定アプリ リダイレクト用ページ
  Gemini Canvas側の共有URLが変わった場合は、
  下記3箇所の「転送先URL」をすべて新しいURLに書き換えてください。
  （このファイル内で書き換えが必要なのはこの3箇所だけです）

  1. すぐ下の <meta http-equiv="refresh"> の url=
  2. <script> 内の REDIRECT_URL
  3. 本文中の「アプリを開く」ボタンの href
  ============================================================
-->
<!-- 転送先URL（1/3: meta refresh） -->
<meta http-equiv="refresh" content="0; url=https://share.gemini.google/PwWZSWINxlEJ">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;text-align:center;padding:24px;
    background:var(--green-lighter);
  }
  .redirect-box{max-width:420px;}
  .redirect-box h1{font-family:var(--font-head);font-size:20px;color:var(--ink);margin:0 0 8px;}
  .redirect-box p{color:var(--ink-soft);margin:0 0 22px;font-size:14px;}
</style>
</head>
<body>

  <div class="redirect-box">
    <h1>要介護認定1次判定アプリへ移動します</h1>
    <p>自動的に移動しない場合は、下のボタンをクリックしてください。</p>
    <!-- 転送先URL（3/3: フォールバックリンク） -->
    <a class="btn btn-primary btn-lg" href="https://share.gemini.google/PwWZSWINxlEJ" target="_blank" rel="noopener noreferrer">
      アプリを開く
    </a>
  </div>

  <script>
    // 転送先URL（2/3: JavaScriptによる即時転送）
    var REDIRECT_URL = "https://share.gemini.google/PwWZSWINxlEJ";
    window.location.replace(REDIRECT_URL);
  </script>

</body>
</html>
